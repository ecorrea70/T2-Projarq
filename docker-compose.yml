name: t2-microservices

# Serviços PHP do i-Educar compartilham a mesma imagem, montagem e ambiente.
# Mesma âncora do T1, apontando para o submodule services/i-educar.
x-ieducar-php: &ieducar-php
  build:
    context: ${IEDUCAR_PATH:-./services/i-educar}/docker/php
    args:
      PHP_VERSION: "8.5"
      COMPOSER_VERSION: "2.10"
      HOST_UID: ${IEDUCAR_HOST_UID:-1001}
      HOST_GID: ${IEDUCAR_HOST_GID:-1001}
  image: t2-microservices-ieducar-php:8.5
  working_dir: /var/www/ieducar
  env_file:
    - path: ${IEDUCAR_PATH:-./services/i-educar}/.env
      required: false
  environment:
    DB_HOST: ieducar-db
    DB_PORT: "5432"
    DB_DATABASE: ${IEDUCAR_DB_NAME:-ieducar}
    DB_USERNAME: ${IEDUCAR_DB_USER:-ieducar}
    DB_PASSWORD: ${IEDUCAR_DB_PASSWORD:-ieducar}
    PGPASSWORD: ${IEDUCAR_DB_PASSWORD:-ieducar}
    CACHE_DRIVER: redis
    REDIS_HOST: ieducar-redis
    XDEBUG_MODE: "off"
  volumes:
    - type: bind
      source: ${IEDUCAR_PATH:-./services/i-educar}
      target: /var/www/ieducar
      bind:
        create_host_path: false
  networks: [ieducar-backend]
  depends_on:
    ieducar-db:
      condition: service_healthy
    ieducar-redis:
      condition: service_healthy

services:
  # ==========================================
  # Infraestrutura de Mensageria (RabbitMQ)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - integration
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ==========================================
  # Moodle (Sistema Externo de Destino)
  # ==========================================
  moodle-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${MOODLE_DB_NAME:-bitnami_moodle}
      POSTGRES_USER: ${MOODLE_DB_USER:-bn_moodle}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Preencha MOODLE_DB_PASSWORD no .env}
    volumes:
      - moodle-postgres:/var/lib/postgresql/data
    networks:
      moodle-backend:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  moodle:
    # Mesma imagem Moodle 5.0.1 do T1, fixada pelo digest.
    image: ${MOODLE_IMAGE:-bitnamilegacy/moodle@sha256:a7bd6bf34b736dad22ee22168d4bfd830b7bedf9e34b89732d92d437317cb1d0}
    environment:
      MOODLE_DATABASE_TYPE: pgsql
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: "5432"
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-bitnami_moodle}
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-bn_moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:?Preencha MOODLE_DB_PASSWORD no .env}
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Preencha MOODLE_ADMIN_PASSWORD no .env}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - moodle-app:/bitnami/moodle
      - moodle-files:/bitnami/moodledata
    ports:
      - "${MOODLE_HTTP_PORT:-8080}:8080"
      - "${MOODLE_HTTPS_PORT:-8443}:8443"
    networks:
      - moodle-backend
      - integration
    depends_on:
      moodle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$context = stream_context_create(['http' => ['timeout' => 5, 'follow_location' => 0]]); exit(@file_get_contents('http://127.0.0.1:8080/login/index.php', false, $$context) === false ? 1 : 0);"]
      interval: 10s
      timeout: 6s
      start_period: 120s
      retries: 30
    restart: unless-stopped

  # ==========================================
  # Microsserviço 3: moodle-service + Banco Próprio
  # ==========================================
  moodle-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MOODLE_SERVICE_DB_NAME:-moodle_service}
      POSTGRES_USER: ${MOODLE_SERVICE_DB_USER:-moodle_service}
      POSTGRES_PASSWORD: ${MOODLE_SERVICE_DB_PASSWORD:-moodle_service}
    volumes:
      - moodle-service-postgres:/var/lib/postgresql/data
    networks:
      - moodle-service-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  moodle-service:
    build:
      context: ./services/moodle-service
    environment:
      PORT: "8003"
      DATABASE_URL: postgresql+psycopg://${MOODLE_SERVICE_DB_USER:-moodle_service}:${MOODLE_SERVICE_DB_PASSWORD:-moodle_service}@moodle-service-db:5432/${MOODLE_SERVICE_DB_NAME:-moodle_service}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_ENABLED: "true"
      MOODLE_URL: ${MOODLE_URL:-http://moodle:8080}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      MOODLE_CATEGORY_ID: ${MOODLE_CATEGORY_ID:-1}
      MOODLE_TEACHER_ROLE_ID: ${MOODLE_TEACHER_ROLE_ID:-3}
      MOODLE_STUDENT_ROLE_ID: ${MOODLE_STUDENT_ROLE_ID:-5}
      MOODLE_CONNECT_TIMEOUT: ${MOODLE_CONNECT_TIMEOUT:-5}
      MOODLE_READ_TIMEOUT: ${MOODLE_READ_TIMEOUT:-15}
      LOCAL_MAX_RETRIES: ${LOCAL_MAX_RETRIES:-2}
      LOCAL_RETRY_BASE_DELAY: ${LOCAL_RETRY_BASE_DELAY:-1.0}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      RABBITMQ_RETRY_TTL_MS: ${RABBITMQ_RETRY_TTL_MS:-10000}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-5}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RECOVERY_SECONDS: ${CB_RECOVERY_SECONDS:-30}
      FAULT_INJECT_DROP_AFTER_COURSE_CREATE: ${FAULT_INJECT_DROP_AFTER_COURSE_CREATE:-false}
      FAULT_INJECT_TARGET_IDNUMBER: ${FAULT_INJECT_TARGET_IDNUMBER:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MOODLE_SERVICE_PORT:-8003}:8003"
    networks:
      - moodle-service-backend
      - integration
    # Não depende do moodle healthy: deve subir e operar com resiliência mesmo se o Moodle estiver fora do ar (Cenário 2).
    depends_on:
      moodle-service-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # Microsserviço 2: sync-service + Banco Próprio
  # ==========================================
  sync-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SYNC_SERVICE_DB_NAME:-sync_service}
      POSTGRES_USER: ${SYNC_SERVICE_DB_USER:-sync_service}
      POSTGRES_PASSWORD: ${SYNC_SERVICE_DB_PASSWORD:-sync_service}
    volumes:
      - sync-service-postgres:/var/lib/postgresql/data
    networks:
      - sync-service-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sync-service:
    build:
      context: ./services/sync-service
    environment:
      PORT: "8002"
      DATABASE_URL: postgresql+psycopg://${SYNC_SERVICE_DB_USER:-sync_service}:${SYNC_SERVICE_DB_PASSWORD:-sync_service}@sync-service-db:5432/${SYNC_SERVICE_DB_NAME:-sync_service}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_ENABLED: "true"
      IEDUCAR_SOURCE: ${IEDUCAR_SOURCE:-mock}
      IEDUCAR_SERVICE_URL: ${IEDUCAR_SERVICE_URL:-http://ieducar-service:8004}
      MOODLE_SERVICE_URL: http://moodle-service:8003
      MOODLE_SETUP_CHECK_ENABLED: ${MOODLE_SETUP_CHECK_ENABLED:-true}
      INSTITUTION_ID: ${INSTITUTION_ID:-1}
      SYNC_LOCK_SCOPE: ${SYNC_LOCK_SCOPE:-global}
      IEDUCAR_NOTICES_ENABLED: ${IEDUCAR_NOTICES_ENABLED:-true}
      IEDUCAR_NOTICE_RETRY_TTL_MS: ${IEDUCAR_NOTICE_RETRY_TTL_MS:-15000}
      IEDUCAR_NOTICE_MAX_ATTEMPTS: ${IEDUCAR_NOTICE_MAX_ATTEMPTS:-10}
    # Sem porta publicada: uso externo apenas via api-gateway :8000
    networks:
      - sync-service-backend
      - integration
    depends_on:
      sync-service-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      moodle-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # API Gateway — borda pública
  # ==========================================
  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      PORT: "8000"
      SYNC_API_TOKEN: ${SYNC_API_TOKEN:?Preencha SYNC_API_TOKEN no .env}
      SYNC_SERVICE_URL: http://sync-service:8002
      AGGREGATE_HEALTH: "true"
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    networks:
      - integration
    depends_on:
      sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # i-Educar (Sistema Externo de Origem)
  # Instância real, igual à do T1, vinda do submodule services/i-educar.
  # ==========================================
  ieducar-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${IEDUCAR_DB_NAME:-ieducar}
      POSTGRES_USER: ${IEDUCAR_DB_USER:-ieducar}
      POSTGRES_PASSWORD: ${IEDUCAR_DB_PASSWORD:-ieducar}
    volumes:
      - ieducar-postgres:/var/lib/postgresql/18/docker
    networks:
      ieducar-backend:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ieducar-redis:
    image: redis:8-alpine
    networks:
      ieducar-backend:
        aliases: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Instalação automática na primeira subida: cria o .env do i-Educar, roda
  # composer new-install e php artisan db:seed se o banco estiver vazio, e sai.
  # É o que mantém o requisito de subir tudo com um único docker compose up.
  ieducar-init:
    <<: *ieducar-php
    command: ["sh", "/init/init.sh"]
    volumes:
      - type: bind
        source: ${IEDUCAR_PATH:-./services/i-educar}
        target: /var/www/ieducar
        bind:
          create_host_path: false
      - type: bind
        source: ./services/ieducar-init
        target: /init
        read_only: true
    restart: "no"

  ieducar-fpm:
    <<: *ieducar-php
    networks:
      ieducar-backend:
        aliases: [fpm]
    depends_on:
      ieducar-db:
        condition: service_healthy
      ieducar-redis:
        condition: service_healthy
      ieducar-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ieducar-horizon:
    <<: *ieducar-php
    command: php artisan horizon
    depends_on:
      ieducar-db:
        condition: service_healthy
      ieducar-redis:
        condition: service_healthy
      ieducar-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Shell avulso para manutenção: docker compose run --rm ieducar-php <comando>
  ieducar-php:
    <<: *ieducar-php
    profiles: [tools]
    command: tail -f /dev/null

  ieducar:
    image: nginx:1.30-alpine
    working_dir: /var/www/ieducar
    volumes:
      - type: bind
        source: ${IEDUCAR_PATH:-./services/i-educar}
        target: /var/www/ieducar
        bind:
          create_host_path: false
      - type: bind
        source: ${IEDUCAR_PATH:-./services/i-educar}/docker/nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IEDUCAR_PATH:-./services/i-educar}/docker/nginx/snippets
        target: /etc/nginx/snippets
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${IEDUCAR_HTTP_PORT:-8081}:80"
    networks:
      - ieducar-backend
      - integration
    depends_on:
      ieducar-fpm:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  # ==========================================
  # Microsserviço 1: ieducar-service + Banco Próprio
  # ==========================================
  ieducar-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${IEDUCAR_SERVICE_DB_NAME:-ieducar_service}
      POSTGRES_USER: ${IEDUCAR_SERVICE_DB_USER:-ieducar_service}
      POSTGRES_PASSWORD: ${IEDUCAR_SERVICE_DB_PASSWORD:-ieducar_service}
    volumes:
      - ieducar-service-postgres:/var/lib/postgresql/data
    networks:
      - ieducar-service-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ieducar-service:
    build:
      context: ./services/ieducar-service
    environment:
      PORT: "8004"
      DATABASE_URL: postgresql+psycopg://${IEDUCAR_SERVICE_DB_USER:-ieducar_service}:${IEDUCAR_SERVICE_DB_PASSWORD:-ieducar_service}@ieducar-service-db:5432/${IEDUCAR_SERVICE_DB_NAME:-ieducar_service}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_ENABLED: "true"
      IEDUCAR_URL: ${IEDUCAR_INTERNAL_URL:-http://ieducar}
      IEDUCAR_TOKEN: ${IEDUCAR_TOKEN:-}
      IEDUCAR_ACCESS_KEY: ${IEDUCAR_ACCESS_KEY:-}
      INSTITUTION_ID: ${INSTITUTION_ID:-1}
      SCHOOL_ID: ${IEDUCAR_SCHOOL_ID:-2,3}
      YEAR: ${IEDUCAR_YEAR:-2026}
      IEDUCAR_CONNECT_TIMEOUT: ${IEDUCAR_CONNECT_TIMEOUT:-5}
      IEDUCAR_READ_TIMEOUT: ${IEDUCAR_READ_TIMEOUT:-30}
      LOCAL_MAX_RETRIES: ${LOCAL_MAX_RETRIES:-2}
      LOCAL_RETRY_BASE_DELAY: ${LOCAL_RETRY_BASE_DELAY:-1.0}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RECOVERY_SECONDS: ${CB_RECOVERY_SECONDS:-30}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-60}
      SCAN_ON_STARTUP: ${SCAN_ON_STARTUP:-true}
    ports:
      - "${IEDUCAR_SERVICE_PORT:-8004}:8004"
    networks:
      - ieducar-service-backend
      - integration
    # Não depende do i-Educar healthy: precisa subir e operar com a origem fora
    # do ar, registrando a varredura como falha e tentando de novo (Cenário 1).
    depends_on:
      ieducar-service-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  integration:
  moodle-backend:
  moodle-service-backend:
  sync-service-backend:
  ieducar-backend:
  ieducar-service-backend:

volumes:
  rabbitmq-data:
  moodle-service-postgres:
  sync-service-postgres:
  ieducar-service-postgres:
  ieducar-postgres:
  moodle-postgres:
    name: ${MOODLE_POSTGRES_VOLUME:-t2-microservices_moodle-postgres}
    external: ${COMPOSE_EXTERNAL_VOLUMES:-false}
  moodle-app:
    name: ${MOODLE_APP_VOLUME:-t2-microservices_moodle-app}
    external: ${COMPOSE_EXTERNAL_VOLUMES:-false}
  moodle-files:
    name: ${MOODLE_FILES_VOLUME:-t2-microservices_moodle-files}
    external: ${COMPOSE_EXTERNAL_VOLUMES:-false}
