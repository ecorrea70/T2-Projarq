[project]
name = "t2-sync-service"
version = "0.1.0"
description = "Orquestrador de sincronização i-Educar × Moodle (T2) — Fase inicial"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "aio-pika>=9.4.0,<10.0",
    "sqlalchemy>=2.0.30,<3.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "alembic>=1.13.0,<2.0",
    "pydantic>=2.8.0,<3.0",
    "pydantic-settings>=2.4.0,<3.0",
    "prometheus-client>=0.20.0,<1.0",
    "email-validator>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"